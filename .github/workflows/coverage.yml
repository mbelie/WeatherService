name: Coverage
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Test filter" # Use tilda for contains
        required: false
        type: string
      run-id:
        description: "Run id"
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release] # Add Debug if you want to have both workflows run in parallel

    runs-on:
      windows-latest # For a list of available runner types, refer to
      # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    env:
      Solution_Name: WeatherService.sln
      Test_Project_Path: WeatherService.Test/WeatherService.Test.csproj

    steps:
      - name: Echo Inputs
        shell: cmd
        run: |
          @echo off
          echo "Filter: ${{ inputs.filter }}"
          echo "Run-id: ${{ inputs.run-id }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install tools
        run: |
          dotnet tool install --local dotnet-coverage
          dotnet tool install --local dotnet-reportgenerator-globaltool

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.run-id }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: List files
        run: dir /s /b
        shell: cmd

      - name: Execute specific unit tests with coverage
        if: ${{ inputs.filter != '' }}
        # filter example: "(Name~Test) | (Name~Test2)"
        # --settings don't seem to work in GitHub. Different collector?
        #run: dotnet tool run dotnet-coverage collect "dotnet test ${{ env.Test_Project_Path }} -c Release --no-build --filter ${{ inputs.filter }} --settings:code-coverage.runsettings" -f cobertura -o coverage.xml
        run: dotnet tool run dotnet-coverage collect "dotnet test -c Release --no-build --filter ${{ inputs.filter }}" -f cobertura -o coverage.xml

      - name: Execute all unit tests with coverage
        if: ${{ inputs.filter == '' }}
        #run: dotnet tool run dotnet-coverage collect "dotnet test ${{ env.Test_Project_Path }} -c Release --no-build --settings:code-coverage.runsettings" -f cobertura -o coverage.xml
        run: dotnet tool run dotnet-coverage collect "dotnet test -c Release --no-build" -f cobertura -o coverage.xml

      - name: Generate coverage report
        run: dotnet tool run reportgenerator -reports:coverage.xml -targetdir:CoverageReport -reporttypes:HtmlInline

      - name: Persist the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: CoverageReport
          path: CoverageReport
