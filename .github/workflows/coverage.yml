
name: Coverage
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Test filter'
        required: true                
        default: 'ClassName~HttpClientWrapper'
        type: string
      confirm:
        description: 'Run tests?'
        type: boolean
        default: true  

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release] # Add Debug if you want to have both workflows run in parallel

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    env:
      Solution_Name: WeatherService.sln
      Test_Project_Path: WeatherService.Test/WeatherService.Test.csproj
      
    steps:
    - name: Echo Inputs
      run: |
          echo "User supplied: ${{ inputs.filter }} as a filter"
          echo "Run tests status: ${{ inputs.confirm }}"

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install tools
      run: |
        dotnet tool install --local dotnet-coverage
        dotnet tool install --local dotnet-reportgenerator-globaltool
          
    - name: Execute specific unit tests with coverage
      if: ${{ inputs.filter != '' }}      
      run: dotnet tool run dotnet-coverage collect "dotnet test --collect:"Code Coverage" --filter ${{ inputs.filter }} --settings:code-coverage.runsettings" -f cobertura -o coverage.xml
      
    - name: Execute all unit tests with coverage
      if: ${{ inputs.filter == '' }}      
      run: dotnet tool run dotnet-coverage collect "dotnet test --settings:code-coverage.runsettings" -f cobertura -o coverage.xml      
    
    - name: Generate coverage report
      run:  dotnet tool run reportgenerator -reports:coverage.xml -targetdir:CoverageReport -reporttypes:HtmlInline

    - name: Persist the coverage report
      uses: actions/upload-artifact@v4
      with:
        name: CoverageReport
        path: CoverageReport
   
