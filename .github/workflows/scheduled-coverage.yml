# Demo a scheduled workflow
name: Scheduled Coverage
on:
 schedule: 
   - cron: '30 19 * * *' # Run every day at 19:30 (UTC-5: 2:30 CT/DST)

jobs:
  call-build:
    uses: ./.github/workflows/build.yml

  call-test:
    needs: call-build
    uses: ./.github/workflows/test.yml
    with:
      filter: ""
