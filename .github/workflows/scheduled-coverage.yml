# Demo a scheduled workflow
name: Scheduled Coverage
on:
 schedule: 
   - cron: '16 19 * * *' # Run every day at 19:16 (UTC-5: 2:16 CT/DST)
     timezone: 'US/Central'

jobs:
  call-build:
    uses: ./.github/workflows/build.yml

  call-test:
    needs: call-build
    uses: ./.github/workflows/test.yml
    with:
      filter: ""
