
# Demo a scheduled workflow
name: Scheduled Coverage
on:
 schedule:
 # Run every day at 18:55 (UTC-5: 13:55 CT/DST)
   - cron: '50 18 * * *'
     timezone: 'US/Central'

jobs:
  call-build:
    uses: ./.github/workflows/build.yml

  call-test:
    needs: call-build
    uses: ./.github/workflows/test.yml
    with:
      filter: ""
